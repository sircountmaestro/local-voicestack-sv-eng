services:
  whisper-stt-sv:
    build: .
    image: local-voicestack-whisper:1.0.0
    container_name: whisper-stt-sv
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LISTEN_HOST: "0.0.0.0"
      LISTEN_PORT: "9000"
      NVIDIA_VISIBLE_DEVICES: ""
      CUDA_VISIBLE_DEVICES: ""
      # STT hålls på CPU medvetet så Kokoro kan ta GPU.
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - ${HOME}/.cache/huggingface:/home/whisper/.cache/huggingface
