name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Shell syntax
        run: bash -n install.sh bin/tts bin/ttsoff bin/tts-sel bin/tts-en bin/tts-sv bin/detect-gpu.sh
      - name: Compose files
        run: |
          cp apps/azure-speech-gateway/.env.example apps/azure-speech-gateway/.env
          cp apps/whisper-stt-sv/.env.example apps/whisper-stt-sv/.env
          docker compose -f apps/azure-speech-gateway/compose.yml config >/dev/null
          docker compose -f apps/whisper-stt-sv/compose.yml config >/dev/null
          docker compose -f apps/kokoro-fastapi/compose.yml config >/dev/null
          docker compose -f apps/kokoro-fastapi/compose.cpu.yml config >/dev/null
      - name: STT unit tests
        working-directory: apps/stt-hotkey
        run: |
          python -m pip install -q numpy
          python -m unittest discover -s tests -v

  gateway-http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dummy env
        run: |
          sed 's/^AZURE_SPEECH_KEY=$/AZURE_SPEECH_KEY=ci-dummy/' \
            apps/azure-speech-gateway/.env.example > apps/azure-speech-gateway/.env
          cp apps/whisper-stt-sv/.env.example apps/whisper-stt-sv/.env
      - name: Build and probe Azure
        run: |
          docker compose -f apps/azure-speech-gateway/compose.yml up -d --build
          for i in $(seq 1 30); do
            if curl -sf --max-time 2 http://127.0.0.1:5050/health >/dev/null; then
              curl -sS http://127.0.0.1:5050/health
              exit 0
            fi
            sleep 2
          done
          docker compose -f apps/azure-speech-gateway/compose.yml logs
          exit 1
      - name: Build and probe Whisper listen
        run: |
          docker compose -f apps/whisper-stt-sv/compose.yml up -d --build
          for i in $(seq 1 40); do
            body="$(curl -sf --max-time 2 http://127.0.0.1:9000/health || true)"
            if echo "$body" | grep -qE '"status": "(starting|loading|ready|error)"'; then
              echo "$body"
              exit 0
            fi
            sleep 3
          done
          docker compose -f apps/whisper-stt-sv/compose.yml logs
          exit 1
